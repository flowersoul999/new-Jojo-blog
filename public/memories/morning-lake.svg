<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12202f"/>
      <stop offset="42%" stop-color="#3c5468"/>
      <stop offset="72%" stop-color="#8b9aa4"/>
      <stop offset="100%" stop-color="#d9c9a4"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ab8c"/>
      <stop offset="30%" stop-color="#5d7183"/>
      <stop offset="100%" stop-color="#22323f"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eef1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8eef1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8eef1" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>

  <circle cx="1130" cy="360" r="120" fill="#f3e4c0" opacity="0.16" filter="url(#soft)"/>

  <path d="M0 372 L200 314 L360 350 L540 288 L720 336 L900 300 L1080 344 L1280 296 L1460 338 L1600 312 L1600 420 L0 420 Z" fill="#2c3f50" opacity="0.9"/>
  <path d="M0 404 L180 372 L340 396 L540 356 L760 392 L960 360 L1180 396 L1400 362 L1600 388 L1600 452 L0 452 Z" fill="#1d2c3a"/>

  <rect y="446" width="1600" height="354" fill="url(#water)"/>
  <rect y="446" width="1600" height="60" fill="#cbbd9c" opacity="0.35" filter="url(#soft)"/>
  <g opacity="0.22" fill="#e9f0f3">
    <rect y="470" width="1600" height="4"/>
    <rect y="512" width="1600" height="3"/>
    <rect y="566" width="1600" height="3"/>
    <rect y="628" width="1600" height="2"/>
    <rect y="700" width="1600" height="2"/>
  </g>

  <g fill="#f0f4f5" opacity="0.32">
    <ellipse cx="400" cy="430" rx="520" ry="26" filter="url(#soft)"/>
    <ellipse cx="1180" cy="392" rx="440" ry="20" filter="url(#soft)"/>
    <ellipse cx="820" cy="466" rx="700" ry="30" filter="url(#soft)"/>
  </g>

  <g fill="#101a24">
    <ellipse cx="472" cy="470" rx="20" ry="6"/>
    <path d="M468 388 q6 -18 14 -2 l4 22 h-22 z"/>
    <rect x="463" y="404" width="19" height="40" rx="6"/>
    <rect x="463" y="442" width="8" height="26" rx="3"/>
    <rect x="474" y="442" width="8" height="26" rx="3"/>
  </g>
  <ellipse cx="472" cy="492" rx="30" ry="7" fill="#0d151d" opacity="0.35" filter="url(#soft)"/>

  <g>
    <rect y="0" width="1600" height="800" fill="url(#mist)" opacity="0.5"/>
    <rect y="180" width="1600" height="180" fill="url(#mist)" opacity="0.55"/>
  </g>

  <rect y="600" width="1600" height="200" fill="#0c151d" opacity="0.45"/>
  <rect width="1600" height="800" filter="url(#grain)" opacity="0.07"/>
</svg>