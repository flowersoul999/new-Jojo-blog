<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1130"/>
      <stop offset="45%" stop-color="#1d2b58"/>
      <stop offset="78%" stop-color="#3c3f6d"/>
      <stop offset="100%" stop-color="#5a4a66"/>
