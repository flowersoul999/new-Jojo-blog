  </g>

  <g stroke="#26374d" stroke-width="6" fill="none" opacity="0.85">
    <path d="M120 86 L120 704"/>
    <path d="M1480 86 L1480 704"/>
    <path d="M0 86 L1600 86"/>
    <path d="M0 704 L1600 704"/>
