    <circle cx="520" cy="424" r="3"/>
  </g>
  <g fill="#ffd08a" opacity="0.7">
    <circle cx="820" cy="290" r="3"/>
    <circle cx="1500" cy="452" r="3"/>
    <circle cx="90" cy="354" r="3"/>
  </g>

  <g fill="#e9f2ff" opacity="0.28">
    <circle cx="180" cy="120" r="2"/>
    <circle cx="420" cy="200" r="1.6"/>
    <circle cx="700" cy="96" r="2"/>
    <circle cx="1060" cy="160" r="1.8"/>
    <circle cx="1380" cy="112" r="2"/>
    <circle cx="1520" cy="240" r="1.6"/>
    <circle cx="320" cy="640" r="1.8"/>
    <circle cx="900" cy="680" r="2"/>
    <circle cx="1240" cy="620" r="1.6"/>
  </g>

  <rect width="1600" height="800" fill="#050a12" opacity="0.35"/>

  <g fill="#080d15">
