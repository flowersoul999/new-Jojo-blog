<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070d"/>
      <stop offset="60%" stop-color="#0c1421"/>
      <stop offset="100%" stop-color="#141f31"/>
    </linearGradient>
    <filter id="streak"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#night)"/>

  <g filter="url(#streak)">
    <rect x="-40" y="300" width="460" height="9" rx="4" fill="#6f9fe0" opacity="0.75"/>
    <rect x="-40" y="352" width="300" height="6" rx="3" fill="#ffd79a" opacity="0.6"/>
    <rect x="120" y="420" width="520" height="7" rx="3" fill="#8fb6ea" opacity="0.5"/>
    <rect x="700" y="286" width="420" height="8" rx="4" fill="#ffcf8a" opacity="0.55"/>
    <rect x="980" y="360" width="560" height="6" rx="3" fill="#7fa8e2" opacity="0.62"/>
    <rect x="1180" y="452" width="420" height="9" rx="4" fill="#ffd79a" opacity="0.45"/>
    <rect x="600" y="520" width="340" height="5" rx="2" fill="#9dc0f0" opacity="0.4"/>
    <rect x="200" y="600" width="380" height="6" rx="3" fill="#6f9fe0" opacity="0.32"/>
  </g>

  <g fill="#7fb0ff" opacity="0.75">
